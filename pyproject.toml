[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-livechat-restored"
version = "2.0.0"
description = "Modern Django scheduled Q&A application (legacy project restored)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Praekelt Foundation (original project); modernized implementation" }]
dependencies = ["Django>=5.2,<6.0"]

[tool.setuptools.packages.find]
include = ["livechat*"]

[tool.setuptools.package-data]
livechat = ["templates/**/*.html", "static/**/*", "migrations/*.py"]
